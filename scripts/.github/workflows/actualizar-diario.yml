name: Actualizar Termómetro Social Chile

on:
  schedule:
    - cron: '0 11 * * *'  # 08:00 AM Chile (UTC-3) = 11:00 UTC
  workflow_dispatch:        # permite ejecutar manualmente desde GitHub

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ejecutar script de actualización
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/actualizar.mjs

      - name: Guardar datos actualizados en GitHub
        run: |
          git config user.name "Termómetro Bot"
          git config user.email "bot@termometro-social.github.io"
          git add data/coeficiente.json data/historial.json
          git diff --staged --quiet || git commit -m "datos: actualización diaria $(date -u +%Y-%m-%d)"
          git push
