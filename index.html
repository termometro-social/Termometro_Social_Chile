<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Termómetro Social Chile · En desarrollo</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  height:100%; background:#030712; color:#fff;
  font-family:'IBM Plex Mono', 'Courier New', monospace;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}
body::before {
  content:''; position:fixed; inset:0; pointer-events:none;
  background: radial-gradient(ellipse at 50% 60%, #1a0408 0%, #030712 70%);
}
.wrap { position:relative; text-align:center; padding:40px 24px; }
.top-line {
  position:fixed; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg, transparent, #e63946, #f4a261, #e63946, transparent);
}
.bot-line {
  position:fixed; bottom:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg, transparent, #e6394644, transparent);
}
.label {
  font-size:10px; letter-spacing:4px; color:#374151;
  margin-bottom:28px;
}
h1 {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: clamp(42px, 12vw, 80px);
  font-weight: 700;
  color: #ffffff;
  line-height: 1.05;
  letter-spacing: -1px;
  margin-bottom: 20px;
}
.divider {
  width:180px; height:1px;
  background:linear-gradient(90deg, transparent, #e6394666, transparent);
  margin:0 auto 20px;
}
.subtitle {
  font-size:11px; letter-spacing:3px; color:#4b5563;
  margin-bottom:36px;
}
.badge {
  display:inline-block;
  border:1px solid #e6394444;
  border-radius:4px;
  padding:10px 28px;
  font-size:10px; letter-spacing:3px; color:#e63946;
}
.pulse { animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse {
  0%, 100% { opacity:1; }
  50% { opacity:0.45; }
}
</style>
</head>
<body>
<div class="top-line"></div>
<div class="wrap">
  <div class="label">TERMÓMETRO SOCIAL · CHILE 2026</div>
  <h1>EN<br>DESARROLLO</h1>
  <div class="divider"></div>
  <div class="subtitle">Estamos calibrando el modelo. Vuelve pronto.</div>
  <div class="badge pulse">⚡ PRÓXIMAMENTE</div>
</div>
<div class="bot-line"></div>
</body>
</html>
